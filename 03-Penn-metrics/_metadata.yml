title: "The Metrics at UNL"
subtitle: "The Good, the Bad, and the Ugly"
date: 2026-04-02
from: markdown+emoji
location: Zoom
abstract: |
  UNL's Executive Leadership Team (ELT) adopted a data-informed approach 
  with the latest round of budget cuts. During the recent Academic Planning 
  Committee hearings, Josh Davis (Vice Chancellor for Institutional Strategy 
  and External Relations) read the following into the public record stating 
  the approach as being 

  > transparent and aligned with institutional priorities. 
  > The metrics selected for instructional and research performance are grounded 
  > in national best practices … These metrics serve as quantitative anchors in 
  > a broader process that includes qualitative input from academic leadership.  

  Faculty in the UNL Department of Statistics have attempted to reproduce the 
  analyses performed by the ELT's data analytics team. Using the partial data 
  made available by the ELT and other sources, the faculty found numerous 
  problems with the data, the metrics, and the analyses. The faculty have 
  repeatedly made these concerns known to the ELT but to no avail.  
  The administration has indicated an intent to use these metrics for future 
  evaluations of faculty and departments. Faculty and staff jobs and student 
  degree programs depend on getting the metrics and corresponding analyses 
  correct. Should these metrics be used now and in the future?  
  
  This seminar discusses the use of quantitative metrics for evaluating the
  performance of academic departments within a university, with the goal of 
  showing faculty the benefits of early, collective action when fighting 
  administrator-driven budget cuts. Hopefully, UNL's poorly-implemented cuts
  and statistical mistakes will serve to immunize other universities against
  repeating those errors and will emphasize the importance of fighting for
  shared governance and other mechanisms for collective bartaining **before** 
  budget cuts are proposed.