title: "How NOT to Measure Academic Performance"
subtitle: "The University of Nebraska -- Lincoln's 'Metrics'"
date: 2026-04-02
from: markdown+emoji
location: Zoom
abstract: |
  In Fall 2025, the University of Nebraska Lincoln announced that there would 
  be 27.5 million dollars of budget cuts, including the closure of several 
  departments and academic programs. The department cuts were (theoretically) 
  motivated by a set of quantitative metrics as well as unspecified qualitative 
  factors. Six departments were proposed for elimination: 
  Educational Administration, Textiles, Merchandising, and Fashion Design, 
  Earth & Atmospheric Science, Statistics, Landscape Architecture, and 
  Community and Regional Planning. Of these, ultimately, the four largest 
  departments were cut, while Landscape Architecture and Community and Regional 
  Planning were merged. Using the data provided to departments and programs, the 
  Statistics department at UNL examined the quantitative metrics, finding 
  several severe errors which undermined the reliability of the decisions 
  made by administration.
  
    
  During the Academic Planning Committee hearings, Josh Davis 
  (at the time, UNL's Vice Chancellor for Institutional Strategy 
  and External Relations) read the following into the public record stating 
  the approach as being 

  > transparent and aligned with institutional priorities. 
  > The metrics selected for instructional and research performance are grounded 
  > in national best practices … These metrics serve as quantitative anchors in 
  > a broader process that includes qualitative input from academic leadership.  
  
  In this seminar, we will discuss the process, the lack of shared governance, 
  and the problems with administrative metrics used to compare departments 
  within a university system. While we will be discussing statistics, no 
  particular quantitative knowledge is assumed. 

